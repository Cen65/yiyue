server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${TLS_KEY_STORE}
    key-store-type: PKCS12
    key-store-password: ${TLS_KEY_STORE_PASSWORD}
  servlet:
    session:
      cookie:
        secure: true
spring:
  data:
    redis:
      password: ${REDIS_PASSWORD}
yiyue:
  demo:
    enabled: false
  login:
    limit-enabled: true
    account-limit: 8
    ip-limit: 60
  payment:
    mock-enabled: false
    worker-enabled: false
