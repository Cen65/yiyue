name: CI
on: [push, pull_request]
jobs:
  yiyue-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yiyue_test
          POSTGRES_USER: yiyue_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U yiyue_test -d yiyue_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: yiyue-server/pom.xml }
      - run: mvn -B verify
        working-directory: yiyue-server
  yiyue-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: yiyue-web/package-lock.json }
      - run: npm ci
        working-directory: yiyue-web
      - run: npm test && npm run build
        working-directory: yiyue-web
